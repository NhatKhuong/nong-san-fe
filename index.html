<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cửa hàng nông sản sạch — rau củ, trái cây, thịt hữu cơ tươi ngon, giao tận nhà."
    />
    <!--
      Font tự host trong /fonts (xem scripts/download-fonts.mjs). Preload đúng hai
      file dùng ngay ở màn hình đầu — bộ tiếng Việt của chữ thân và của tiêu đề.
      Các weight và subset còn lại để trình duyệt tự lấy theo unicode-range.
    -->
    <link
      rel="preload"
      href="/fonts/inter-400-vietnamese.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/quicksand-700-vietnamese.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Nông Sản Sạch — Thực phẩm hữu cơ tươi mỗi ngày</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
